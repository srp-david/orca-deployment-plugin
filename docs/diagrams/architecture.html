<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운영 반영 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · prod-deploy</p>
    <h1>운영 반영 구조</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">운영 반영 구조</title>
        <desc id="architecture-desc">Orca 패널이 워커에 요청하고, 워커와 Claude 스킬이 띄운 CLI 프로세스가 엔진으로 메인 체크아웃·운영 FTP·자격 증명 관리자를 다루며, 진행은 run·작업 기록 파일로 워커가 읽는다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: Orca -->
        <rect x="24" y="60" width="200" height="244" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="36" y="64" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ORCA</text>

        <!-- Arrows (before nodes) -->
        <!-- 패널 → 워커 -->
        <line x1="124" y1="152" x2="124" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="132" y="183" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="148" y="195" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">요청</text>

        <!-- Claude 스킬 → CLI -->
        <line x1="364" y1="152" x2="364" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="372" y="183" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="388" y="195" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">실행</text>

        <!-- 워커 → CLI (운영 FTP 단계) -->
        <line x1="208" y1="248" x2="278" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="227" y="226" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="243" y="238" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">띄움</text>

        <!-- CLI → 엔진 -->
        <line x1="448" y1="260" x2="518" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="464" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="249" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPORT</text>

        <!-- 워커 → 엔진 (짧은 일) -->
        <path d="M 208,272 H 236 Q 244,272 244,280 V 322 Q 244,330 252,330 H 568 Q 576,330 576,322 V 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="384" y="308" width="52" height="16" rx="2" fill="#f5f5f5"/>
        <text x="410" y="320" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">짧은 일</text>

        <!-- 엔진 → 메인 체크아웃 -->
        <path d="M 688,246 H 708 Q 716,246 716,238 V 132 Q 716,124 724,124 H 758" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 엔진 → 운영 FTP (focal) -->
        <line x1="688" y1="260" x2="758" y2="260" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 엔진 → 자격 증명 관리자 -->
        <path d="M 688,274 H 732 Q 740,274 740,282 V 388 Q 740,396 748,396 H 758" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 엔진 → run·작업 기록 -->
        <line x1="632" y1="288" x2="632" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="640" y="319" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="656" y="331" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">쓰기</text>

        <!-- run·작업 기록 → 워커 (진행 읽기) -->
        <path d="M 520,404 H 160 Q 152,404 152,396 V 290" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="368" y="380" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="400" y="392" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">진행 읽기</text>

        <!-- Nodes -->
        <!-- 패널 -->
        <rect x="40" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="124" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">패널</text>
        <text x="124" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/panel.tsx</text>

        <!-- 워커 -->
        <rect x="40" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="232" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="124" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">워커</text>
        <text x="124" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/worker.ts</text>

        <!-- Claude 스킬 (다른 진입점) -->
        <rect x="280" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="96" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="364" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">Claude 스킬</text>
        <text x="364" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skill/prod-deploy</text>

        <!-- CLI 프로세스 -->
        <rect x="280" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="232" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="364" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">CLI 프로세스</text>
        <text x="364" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">detached · src/cli.ts</text>

        <!-- 엔진 -->
        <rect x="520" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="232" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="604" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">엔진</text>
        <text x="604" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/engine/</text>

        <!-- run·작업 기록 (store) -->
        <rect x="520" y="368" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="368" width="168" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="604" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">run·작업 기록</text>
        <text x="604" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runs/ · jobs/*.json</text>

        <!-- 메인 체크아웃 (external) -->
        <rect x="760" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="96" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="844" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">메인 체크아웃</text>
        <text x="844" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">git · gh</text>

        <!-- 운영 FTP (focal) -->
        <rect x="760" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="232" width="168" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="844" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">운영 FTP</text>
        <text x="844" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">curl · FTP</text>

        <!-- 자격 증명 관리자 (external) -->
        <rect x="760" y="368" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="368" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="844" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">자격 증명 관리자</text>
        <text x="844" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prod-deploy:&lt;id&gt;</text>

        <!-- Legend -->
        <line x1="32" y1="460" x2="928" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="32" y="480" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">이 저장소 코드</text>
        <rect x="184" y="480" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="216" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">다른 진입점</text>
        <rect x="324" y="480" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="356" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">파일</text>
        <rect x="424" y="480" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="456" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">PC 의 git·OS</text>
        <rect x="580" y="480" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="612" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">운영 서버</text>
        <line x1="712" y1="486" x2="740" y2="486" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="752" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">진행 알림</text>
      </svg>
    </div>
  </div>
</body>
</html>
