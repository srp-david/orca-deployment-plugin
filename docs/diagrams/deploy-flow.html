<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운영 반영 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · prod-deploy</p>
    <h1>운영 반영 흐름 — 버튼 두 번</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-flow-title deploy-flow-desc">
        <title id="deploy-flow-title">운영 반영 흐름 — 버튼 두 번</title>
        <desc id="deploy-flow-desc">병합된 PR을 고르고 반영 목록 만들기(준비 확인, plan, 백업, 운영 읽기만)를 누른 뒤, 사람이 반영 목록을 확인하고 업로드(직전 재대조, 업로드, 대조)를 누르며, 대조가 어긋나면 되돌린다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (버튼 하나가 하는 일) -->
        <rect x="184" y="36" width="744" height="116" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="196" y="40" width="204" height="16" rx="2" fill="#f5f5f5"/>
        <text x="204" y="52" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">① 반영 목록 만들기 버튼 · 운영 읽기만</text>

        <rect x="416" y="288" width="512" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="428" y="292" width="144" height="16" rx="2" fill="#f5f5f5"/>
        <text x="436" y="304" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">② 업로드 버튼 · 운영 쓰기</text>

        <!-- Arrows (before nodes) -->
        <line x1="144" y1="104" x2="214" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="400" y1="104" x2="446" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="408" y="82" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="424" y="94" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">통과</text>

        <line x1="632" y1="104" x2="678" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="772" y1="132" x2="772" y2="194" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="772" y1="252" x2="772" y2="326" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="720" y="281" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="742" y="293" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">누르면</text>

        <line x1="680" y1="356" x2="634" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="448" y1="356" x2="370" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="386" y="334" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="408" y="346" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">맞으면</text>

        <line x1="540" y1="384" x2="540" y2="454" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="476" y="411" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="504" y="423" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">어긋나면</text>

        <!-- Nodes -->
        <!-- Start oval: PR 고르기 -->
        <rect x="32" y="80" width="112" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="32" y="80" width="112" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="88" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">PR 고르기</text>

        <!-- 준비 확인 -->
        <rect x="216" y="76" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="76" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="308" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">준비 확인</text>
        <text x="308" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">git fetch · gh pr view</text>

        <!-- plan -->
        <rect x="448" y="76" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="76" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">plan</text>
        <text x="540" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FTP read · confirm code</text>

        <!-- 백업 -->
        <rect x="680" y="76" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="76" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="772" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">백업</text>
        <text x="772" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FTP read → backup/</text>

        <!-- 반영 목록 확인 (focal: 사람이 판단) -->
        <rect x="680" y="196" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="196" width="184" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="772" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">반영 목록 확인</text>
        <text x="772" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">files · confirm code</text>

        <!-- 업로드 (focal: 운영 쓰기) -->
        <rect x="680" y="328" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="328" width="184" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="772" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">업로드</text>
        <text x="772" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">recheck · upload · rename</text>

        <!-- 대조 -->
        <rect x="448" y="328" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="328" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">대조</text>
        <text x="540" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sha256 = local</text>

        <!-- End oval: 남은 사람 할 일 -->
        <rect x="200" y="332" width="168" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="332" width="168" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="284" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">남은 사람 할 일</text>
        <text x="284" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">restart · SQL · HISTORY</text>

        <!-- 되돌리기 (문제가 생겼을 때) -->
        <rect x="448" y="456" width="184" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="456" width="184" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="540" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">되돌리기</text>
        <text x="540" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">backup → FTP</text>

        <!-- Callouts -->
        <path d="M 300 168 Q 300 150 308 136" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="308" cy="134" r="2" fill="#4f5d75"/>
        <text x="216" y="188" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif">준비 확인이 실패하거나 plan 에 문제가 있으면</text>
        <text x="216" y="208" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif">여기서 멈추고 할 일을 보여 줍니다</text>

        <path d="M 764 424 Q 766 404 772 390" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="772" cy="388" r="2" fill="#4f5d75"/>
        <text x="680" y="442" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif">업로드 직전 운영 파일이</text>
        <text x="680" y="462" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif">plan 때와 다르면 올리지 않습니다</text>

        <!-- Legend -->
        <line x1="32" y1="532" x2="928" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="32" y="552" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="64" y="562" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">시작·끝</text>
        <rect x="152" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="562" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">자동 단계</text>
        <rect x="288" y="552" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="320" y="562" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">사람이 판단·누름</text>
        <rect x="472" y="552" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="504" y="562" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">버튼 하나가 하는 일</text>
        <line x1="672" y1="558" x2="700" y2="558" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="712" y="562" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">문제가 생겼을 때</text>
      </svg>
    </div>
  </div>
</body>
</html>
